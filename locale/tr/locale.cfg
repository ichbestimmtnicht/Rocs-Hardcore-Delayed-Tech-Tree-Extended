rocs-hardcore-push-back-landfill=Gleba teknolojisini gerektirir.
rocs-hardcore-push-back-logistic-system=Gleba teknolojisini gerektirir. İstekli göğüsler ve buffer göğüsler, üretmek için karbon fiber gerektirir.
rocs-hardcore-push-back-cliff-explosives=Askeri, Vulcanus, Fulgora ve Gleba teknolojisini gerektirir.
rocs-hardcore-push-back-kovarex-enrichment=Gleba ve Fulgora teknolojisini gerektirir.
rocs-hardcore-push-back-atomic-bomb=Gleba ve Fulgora teknolojisini gerektirir.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Her sonsuz araştırma teknolojisi, ağojenik bilim paketleri gerektiren yeni sonsuz bir alçaltıcı ile tek bir teknolojiye dönüştürülür. Sadece sonsuz (final) teknolojisinin gecikdiğini unutmayın, daha önce tek bir araştırma adımları değil.
rocs-hardcore-push-back-night-vision-equipment=Gleba teknolojisini gerektirir.
rocs-hardcore-z-infinite-tech-blacklist=Sonsuz teknolojileri geride bırakmayacak olan teknolojilerin Blacklist of technologies (iş için Sonsuz Araştırma ayarını tamamla).
