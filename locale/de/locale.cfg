[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Erfordert logistische Wissenschaftspakete.
rocs-hardcore-push-back-landfill=Benötigt Gleba Tech.
rocs-hardcore-push-back-logistic-system=Benötigt Gleba Tech. Requester-Kästen und Pufferkästen erfordern Kohlefaser zu produzieren.
rocs-hardcore-push-back-cliff-explosives=Benötigt Militär, Vulcanus, Fulgora und Gleba Tech.
rocs-hardcore-push-back-kovarex-enrichment=Benötigt Gleba und Fulgora Tech.
rocs-hardcore-push-back-atomic-bomb=Benötigt Gleba und Fulgora Tech.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Jede unendliche Forschungstechnologie wird in eine einzige Technologie mit einem neuen unendlichen Nachkommen umgewandelt, der kryogene Wissenschaftspakete erfordert. Beachten Sie, dass nur die unendliche (endgültige) Technologie verzögert wird, keine einzelnen Forschungsschritte davor.
rocs-hardcore-push-back-night-vision-equipment=Benötigt Gleba Tech.
rocs-hardcore-z-infinite-tech-blacklist=Blacklist von Technologien, die nicht hinter unendlichen Technologien platziert werden (erfordert die Einstellung von Infinite Research, um zu funktionieren).
[technology-name]
infinite-research=Unendliche Forschung
hardcore-active-provider-chests=Aktiver Anbieter Logistik Truhe
[technology-description]
infinite-research=Das Zeitalter der Erleuchtung geht für immer weiter.
hardcore-active-provider-chests=Erweitert die Fähigkeiten von Logistikrobotern, indem sie ihre Inhalte zur Speicherung oder Verwendung an anderer Stelle verschieben.
