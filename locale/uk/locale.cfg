[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Вимоги до логістичних наук.
rocs-hardcore-push-back-landfill=Потрібні технології Gleba.
rocs-hardcore-push-back-logistic-system=Потрібні технології Gleba. Заявка грудей і буферних грудей вимагають вуглецевого волокна для виробництва.
rocs-hardcore-push-back-cliff-explosives=Вимагає військових, Vulcanus, Fulgora і Gleba tech.
rocs-hardcore-push-back-kovarex-enrichment=Потрібні технології Gleba і Fulgora.
rocs-hardcore-push-back-atomic-bomb=Потрібні технології Gleba і Fulgora.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Кожна нескінченна технологія досліджень перетворюється в одну технологію з новим нескінченним нащадком, що вимагає кріогенних наук. Зверніть увагу, що тільки нескінченна (фінансова) технологія затримується, не будь-які однодослідні дії до неї.
rocs-hardcore-push-back-night-vision-equipment=Потрібні технології Gleba.
rocs-hardcore-z-infinite-tech-blacklist=Чорний список технологій, які не будуть розміщені за нескінченними технологіями (потребує налаштування дослідження Infinite для роботи).
