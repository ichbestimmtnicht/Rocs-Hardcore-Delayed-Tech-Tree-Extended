rocs-hardcore-push-back-atomic-bomb=需要Gleba和Fulgora科技.
rocs-hardcore-z-infinite-tech-needs-cryogenic=每個無限的研究技術都被轉換成一個有新的無限後代的科技 需要低溫科學包 注意只有無限(最後)科技被延遲.
rocs-hardcore-push-back-night-vision-equipment=需要格萊巴科技.
rocs-hardcore-z-infinite-tech-blacklist=不會被放在無限科技后面的科技黑名單(需要無限研究設定才能工作).
