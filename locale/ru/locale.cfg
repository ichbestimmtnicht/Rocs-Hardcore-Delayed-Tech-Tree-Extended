[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Требуются пакеты логистических наук.
rocs-hardcore-push-back-landfill=Требуется технология Gleba.
rocs-hardcore-push-back-logistic-system=Требуется технология Gleba. Запрашивающие сундуки и буферные сундуки требуют углеродного волокна для производства.
rocs-hardcore-push-back-cliff-explosives=Требуется военная техника, Вулкан, Фулгора и Глеба.
rocs-hardcore-push-back-kovarex-enrichment=Требуется технология Gleba и Fulgora.
rocs-hardcore-push-back-atomic-bomb=Требуется технология Gleba и Fulgora.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Каждая бесконечная исследовательская технология превращается в единую технологию с новым бесконечным потомком, нуждающимся в криогенных научных пакетах. Обратите внимание, что только бесконечная (конечная) технология задерживается, а не какие-либо шаги до нее.
rocs-hardcore-push-back-night-vision-equipment=Требуется технология Gleba.
rocs-hardcore-z-infinite-tech-blacklist=Черный список технологий, которые не будут стоять за бесконечными технологиями (требуется установка Infinite Research для работы).
