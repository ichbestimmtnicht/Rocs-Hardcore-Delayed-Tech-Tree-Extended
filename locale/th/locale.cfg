[mod-setting-description]
rocs-hardcore-push-back-repair-pack=ต้องบรรจุอุปกรณ์วิทยาศาสตร์.
rocs-hardcore-push-back-landfill=ต้องการเทคโนโลยีของเกลบา.
rocs-hardcore-push-back-logistic-system=ต้องการเทคโนโลยีของเกลบา หน้าอกและหีบกันกระสุน ต้องการคาร์บอนไฟเบอร์เพื่อผลิต.
rocs-hardcore-push-back-cliff-explosives=ต้องการทหาร,วัลแคนตัส, ฟูลโกรา และเทคโนโลยีเกลบา.
rocs-hardcore-push-back-kovarex-enrichment=ต้องการอุปกรณ์ของเกลบาและฟูลโกรา.
rocs-hardcore-push-back-atomic-bomb=ต้องการอุปกรณ์ของเกลบาและฟูลโกรา.
rocs-hardcore-z-infinite-tech-needs-cryogenic=แต่ละเทคโนโลยีวิจัยที่ไม่สิ้นสุด ถูกดัดแปลงให้เป็นเทคโนโลยีเดียว โดยมีทายาทที่ไม่มีที่สิ้นสุด หมายเหตุที่มีเพียงเทคโนโลยีไม่มีที่สิ้นสุด (รอบสุดท้าย) จะล่าช้าไม่ได้แม้แต่ขั้นตอนเดียวก่อนมัน.
rocs-hardcore-push-back-night-vision-equipment=ต้องการเทคโนโลยีของเกลบา.
rocs-hardcore-z-infinite-tech-blacklist=แบล็คลิสต์ของเทคโนโลยี ที่จะไม่ถูกนํามาวางไว้ อยู่เบื้องหลังเทคโนโลยีไร้ขอบเขต (ตรวจสอบการตั้งค่าการวิจัยอินฟินไทน์).
