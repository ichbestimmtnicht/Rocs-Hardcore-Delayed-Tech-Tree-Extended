[technology-description]
infinite-research=ยุคแห่งแสงสว่างดําเนินต่อไปตลอดกาล.
hardcore-active-provider-chests=จง ขยาย ความ สามารถ ของ หุ่น ยนต์ ใน การ ทํา ไม้ ด้วย การ ผลัก ดัน ให้ เก็บ หรือ ใช้ ใน ที่ อื่น ๆ.
