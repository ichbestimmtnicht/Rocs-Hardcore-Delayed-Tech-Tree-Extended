[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Изисква логистични научни пакети.
rocs-hardcore-push-back-landfill=Изисква Gleba технология.
rocs-hardcore-push-back-logistic-system=Изисква Gleba технология. Гърдите и буферните гърди изискват въглеродни влакна да произвеждат.
rocs-hardcore-push-back-cliff-explosives=Изисква военни, вулканци, Фулгора и Глеба технологии.
rocs-hardcore-push-back-kovarex-enrichment=Изисква Глеба и Фулгора технологии.
rocs-hardcore-push-back-atomic-bomb=Изисква Глеба и Фулгора технологии.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Всяка безкрайна научноизследователска технология се превръща в единна технология с нов безкраен потомък, изискващ криогенни научни пакети. Имайте предвид, че само безкрайната (окончателна) технология се забавя, а не каквито и да било единични стъпки преди нея.
rocs-hardcore-push-back-night-vision-equipment=Изисква Gleba технология.
rocs-hardcore-z-infinite-tech-blacklist=Черен списък на технологии, които няма да бъдат поставени зад безкрайни технологии (търси Безкрайната Настройка за научни изследвания, за да работи).
