[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Éilíonn pacáistí eolaíochta lóistíochta.
rocs-hardcore-push-back-landfill=Éilíonn Gleba ardteicneolaíochta.
rocs-hardcore-push-back-logistic-system=Éilíonn Gleba ardteicneolaíochta. Éilíonn cófraí iarrthóir agus cófraí maolán snáithín carbóin a tháirgeadh.
rocs-hardcore-push-back-cliff-explosives=Éilíonn míleata, Vulcanus, Fulgora agus Gleba ardteicneolaíochta.
rocs-hardcore-push-back-kovarex-enrichment=Éilíonn Gleba agus Fulgora ardteicneolaíochta.
rocs-hardcore-push-back-atomic-bomb=Éilíonn Gleba agus Fulgora ardteicneolaíochta.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Tá gach teicneolaíocht taighde gan teorainn thiontú i dteicneolaíocht amháin le shliocht gan teorainn nua ag teastáil pacáistí eolaíochta caoinóigineach. Tabhair faoi deara go bhfuil ach an gan teorainn (final) teicneolaíocht moill, ní aon céimeanna aon-taighde os a chomhair.
rocs-hardcore-push-back-night-vision-equipment=Éilíonn Gleba ardteicneolaíochta.
rocs-hardcore-z-infinite-tech-blacklist=Blacklist na dteicneolaíochtaí nach mbeidh a chur taobh thiar de na teicneolaíochtaí gan teorainn (éilíonn an suíomh Taighde Infinite a bheith ag obair).
