[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Απαιτεί πακέτα επιστήμης εφοδιαστικής.
rocs-hardcore-push-back-landfill=Απαιτεί τεχνολογία Γκλέμπα.
rocs-hardcore-push-back-logistic-system=Απαιτεί τεχνολογία Γκλέμπα. Οι θώρακες των αιτούντων και οι ρυθμιστές θώρακες απαιτούν ανθρακονήματα για να παράγουν.
rocs-hardcore-push-back-cliff-explosives=Απαιτεί στρατό, Βολκάνιο, Φούλγκορα και Γκλέμπα.
rocs-hardcore-push-back-kovarex-enrichment=Απαιτεί τεχνολογία Γκλέμπα και Φούλγκορα.
rocs-hardcore-push-back-atomic-bomb=Απαιτεί τεχνολογία Γκλέμπα και Φούλγκορα.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Κάθε άπειρη ερευνητική τεχνολογία μετατρέπεται σε μια ενιαία τεχνολογία με ένα νέο άπειρο απόγονο που απαιτεί κρυογονική επιστήμη πακέτα. Σημειώστε ότι μόνο η άπειρη (τελική) τεχνολογία καθυστερεί, όχι κανένα μόνο-ερευνητικό βήμα πριν από αυτό.
rocs-hardcore-push-back-night-vision-equipment=Απαιτεί τεχνολογία Γκλέμπα.
rocs-hardcore-z-infinite-tech-blacklist=Μαύρη λίστα τεχνολογιών που δεν θα τεθούν πίσω από άπειρες τεχνολογίες (απαιτεί την απειροελάχιστη ρύθμιση έρευνας για να λειτουργήσει).
