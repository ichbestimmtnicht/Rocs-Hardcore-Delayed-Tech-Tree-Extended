[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Requiere paquetes de ciencia logística.
rocs-hardcore-push-back-landfill=Requiere tecnología Gleba.
rocs-hardcore-push-back-logistic-system=Requiere tecnología Gleba. Los cofres y los cofres de amortiguación requieren fibra de carbono para producir.
rocs-hardcore-push-back-cliff-explosives=Requiere la tecnología militar, Vulcanus, Fulgora y Gleba.
