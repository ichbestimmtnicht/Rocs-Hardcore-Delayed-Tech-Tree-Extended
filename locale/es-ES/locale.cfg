rocs-hardcore-push-back-atomic-bomb=Requiere tecnología Gleba y Fulgora.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Cada tecnología infinita de investigación se convierte en una sola tecnología con un nuevo descendiente infinito que requiere paquetes de ciencia criogénica. Tenga en cuenta que sólo la tecnología infinita (final) se retrasa, no cualquier paso de investigación individual ante ella.
rocs-hardcore-push-back-night-vision-equipment=Requiere tecnología Gleba.
rocs-hardcore-z-infinite-tech-blacklist=Blacklist of technologies that will not be placed behind infinite technologies (requieres the Infinite Research setting to work).
