[mod-setting-description]
rocs-hardcore-push-back-repair-pack=Richiede pacchetti di scienze logistiche.
rocs-hardcore-push-back-landfill=Richiede la tecnologia Gleba.
rocs-hardcore-push-back-logistic-system=Richiede la tecnologia Gleba. I cassetti e i cassetti buffer richiedono fibra di carbonio per produrre.
rocs-hardcore-push-back-cliff-explosives=Richiede militari, Vulcanus, Fulgora e Gleba tech.
rocs-hardcore-push-back-kovarex-enrichment=Richiede la tecnologia Gleba e Fulgora.
rocs-hardcore-push-back-atomic-bomb=Richiede la tecnologia Gleba e Fulgora.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Ogni tecnologia di ricerca infinita viene trasformata in un'unica tecnologia con un nuovo discendente infinito che richiede pacchetti di scienze criogeniche. Si noti che solo la tecnologia infinita (finale) è ritardata, non qualsiasi singolo passo di ricerca prima di esso.
rocs-hardcore-push-back-night-vision-equipment=Richiede la tecnologia Gleba.
rocs-hardcore-z-infinite-tech-blacklist=Blacklist di tecnologie che non saranno poste dietro infinite tecnologie (richiede l'impostazione della ricerca infinita al lavoro).
