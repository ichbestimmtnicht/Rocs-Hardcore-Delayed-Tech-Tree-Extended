rocs-hardcore-push-back-repair-pack=Nécessite des packs de science logistique.
rocs-hardcore-push-back-landfill=Nécessite une technologie Gleba.
rocs-hardcore-push-back-logistic-system=Nécessite une technologie Gleba. Les poitrines de demande et les poitrines tampons ont besoin de fibres de carbone pour produire.
rocs-hardcore-push-back-cliff-explosives=Nécessite des techniciens militaires, Vulcanus, Fulgora et Gleba.
