rocs-hardcore-push-back-atomic-bomb=Nécessite la technologie Gleba et Fulgora.
rocs-hardcore-z-infinite-tech-needs-cryogenic=Chaque technologie de recherche infinie est transformée en une seule technologie avec un nouveau descendant infini nécessitant des packs de science cryogénique. Notez que seule la technologie infinie (finale) est retardée, et non aucune étape de recherche unique avant elle.
